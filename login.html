<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICON — Login</title>
  <link rel="icon" type="image/jpeg" href="images/icon_logo.jpg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS 3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            champagne: {
              300: '#ecbf5f',
            },
            charcoal: '#1f1f24',
            ivory: '#faf7ef',
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --gold: #ecbf5f;
      --gold-light: #f3d89b;
      --obsidian: #0a0a0d;
      --ivory: #faf7ef;
    }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background-color: var(--obsidian);
      color: var(--ivory);
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url('images/hero_watch.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.25;
      z-index: -1;
      filter: saturate(0.5);
    }
    .login-panel {
      background: rgba(10, 10, 13, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(200, 137, 26, 0.25);
      padding: 3rem;
      width: 100%;
      max-width: 440px;
      position: relative;
    }
    .gold-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .input-field {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(250, 247, 239, 0.3);
      padding: 0.75rem 0;
      color: var(--ivory);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .input-field:focus {
      border-bottom-color: var(--gold);
    }
    .input-field::placeholder {
      color: rgba(250, 247, 239, 0.4);
    }
    .btn-gold {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
      padding: 1rem 0;
      width: 100%;
      border: 1px solid var(--gold);
      color: var(--gold);
      background: transparent;
      position: relative;
      overflow: hidden;
      transition: color 0.4s ease;
      cursor: pointer;
      display: inline-block;
      text-align: center;
      margin-top: 2rem;
    }
    .btn-gold::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .btn-gold:hover::before {
      transform: scaleX(1);
    }
    .btn-gold:hover {
      color: var(--obsidian);
    }
    .btn-gold span {
      position: relative;
      z-index: 1;
    }
    .link {
      color: rgba(250, 247, 239, 0.5);
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      transition: color 0.3s;
      cursor: pointer;
    }
    .link:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  
  <div class="login-panel">
    <!-- Back to home -->
    <a href="index.html" class="absolute top-6 right-6 link" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </a>

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="flex items-center gap-3">
        <img src="images/icon_logo.jpg" alt="Icon Logo" class="h-14 w-auto object-contain rounded-md" />
        <span style="font-family:'Playfair Display',serif; font-size:1.6rem; letter-spacing:0.15em; color:#ecbf5f; line-height:1;">ICON</span>
      </div>
      <div class="gold-line mt-3 w-16"></div>
    </div>

    <!-- Form -->
    <div class="text-center mb-6">
      <h2 style="font-family:'Playfair Display',serif; font-size:1.5rem; color:#faf7ef; margin-bottom:0.5rem;">Client Portal</h2>
      <p style="font-family:'Cormorant Garamond',serif; font-size:1rem; color:rgba(250,247,239,0.6);">Access your private collection.</p>
    </div>

    <form onsubmit="event.preventDefault(); window.location.href='index.html';">
      <div class="space-y-4">
        <div>
          <input type="email" class="input-field" placeholder="Email Address" required />
        </div>
        <div>
          <input type="password" class="input-field" placeholder="Password" required />
        </div>
      </div>
      
      <div class="flex justify-between items-center mt-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="accent-[#ecbf5f] bg-transparent" />
          <span style="font-size:0.7rem; color:rgba(250,247,239,0.5); letter-spacing:0.05em;">Remember me</span>
        </label>
        <a class="link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-gold">
        <span>Sign In</span>
      </button>
    </form>

    <div class="text-center mt-8">
      <p style="font-size:0.75rem; color:rgba(250,247,239,0.5);">Not a private client yet? <a href="index.html#private-client" class="link" style="color:var(--gold);">Request Access</a></p>
    </div>
  </div>

</body>
</html>
